name: Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Feste Debug-Signatur wiederherstellen
        run: base64 --decode app/debug.keystore.b64 > app/debug.keystore

      - name: Debug-APK bauen
        id: buildapk
        continue-on-error: true
        run: |
          status=0
          gradle :app:assembleDebug --stacktrace --no-daemon > build.log 2>&1 || status=1
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Release-APK bauen (R8-minifiziert, signiert)
        id: buildrelease
        if: steps.buildapk.outputs.status == '0'
        continue-on-error: true
        run: |
          status=0
          gradle :app:assembleRelease --stacktrace --no-daemon > release-build.log 2>&1 || status=1
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: APKs sammeln
        if: steps.buildapk.outputs.status == '0'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/
          fi

      - name: APKs als Release veröffentlichen
        if: steps.buildapk.outputs.status == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: Automatischer APK-Build
          body: |
            APKs aus dem aktuellen Stand von main.

            - app-release.apk – signierte Release-Version (R8-minifiziert): kleiner & schneller, empfohlen zum Installieren
            - app-debug.apk – Debug-Version (falls die Release-APK auf einem Gerät nicht laufen sollte)

            Auf dem Handy öffnen und installieren
            ("Installation aus unbekannten Quellen" für den Browser erlauben).
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fehler-Log ins Repository committen
        if: steps.buildapk.outputs.status != '0' || steps.buildrelease.outputs.status != '0'
        run: |
          rm -f last-build-error.log
          if [ "${{ steps.buildapk.outputs.status }}" != "0" ] && [ -f build.log ]; then
            tail -n 400 build.log > last-build-error.log
          fi
          if [ "${{ steps.buildrelease.outputs.status }}" != "0" ] && [ -n "${{ steps.buildrelease.outputs.status }}" ] && [ -f release-build.log ]; then
            tail -n 400 release-build.log >> last-build-error.log
          fi
          if [ ! -f last-build-error.log ]; then
            echo "Kein Build-Log vorhanden – nichts zu committen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-build-error.log
          if git diff --cached --quiet; then
            echo "Fehler-Log unverändert – kein Commit nötig."
            exit 0
          fi
          git commit -m "[skip ci] Build-Fehlerprotokoll aktualisieren"
          git pull --rebase --autostash origin main || true
          git push
